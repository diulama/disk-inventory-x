name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: scripts/build-release.sh build/release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Disk-Inventory-X
          path: build/release/*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/release/*.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --draft
